name: GitHub Pages

# main dalina her push'ta GitHub Pages'e yayinlar.
# Cloudflare yayini ayri is akisinda, kok yolda calismaya devam eder.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Uretim derlemesi
        env:
          TABAN: /yks-kocluk/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Tek sayfa uygulamasi icin 404 yedegi
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - id: dagitim
        uses: actions/deploy-pages@v4
