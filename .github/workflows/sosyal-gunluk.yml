name: Sosyal - günlük paylaşım

# Her gün 09:00 (Türkiye) çalışır, o güne ait gönderiyi Buffer'a planlar.
# Elle çalıştırmak için: Actions -> bu iş akışı -> Run workflow
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      deneme:
        description: 'Deneme modu (Buffer a göndermez, sadece gösterir)'
        type: boolean
        default: true
      tarih:
        description: 'Hangi günün gönderisi? (boş = bugün, örn. 2026-09-22)'
        required: false
        default: ''

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Günün gönderisini Buffer'a planla
        shell: python
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DENEME: ${{ inputs.deneme }}
          TARIH: ${{ inputs.tarih }}
        run: |
          import json, os, sys, mimetypes, pathlib, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone

          TR = timezone(timedelta(hours=3))          # Türkiye, yaz/kış farkı yok
          KUYRUK = pathlib.Path("sosyal/kuyruk.json")
          KOVA = "sosyal"
          env = os.environ.get

          def buffer(sorgu, degisken=None):
              anahtar = env("BUFFER_API_KEY")
              if not anahtar:
                  sys.exit("BUFFER_API_KEY secret'i yok.")
              govde = json.dumps({"query": sorgu, "variables": degisken or {}}).encode()
              r = urllib.request.Request("https://api.buffer.com", data=govde, headers={
                  "Authorization": "Bearer " + anahtar,
                  "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=60) as c:
                      veri = json.loads(c.read())
              except urllib.error.HTTPError as h:
                  sys.exit("Buffer HTTP %s: %s" % (h.code, h.read().decode()[:500]))
              if veri.get("errors"):
                  sys.exit("Buffer hatasi: " + json.dumps(veri["errors"], ensure_ascii=False))
              return veri["data"]

          # 1) Kanalları listele: istendiğinde ya da hiçbir kanal kimliği yoksa
          def kanallari_listele():
              print("Buffer'a bagli kanallar:\n")
              orgs = buffer("{ account { organizations { id name } } }")["account"]["organizations"]
              for o in orgs:
                  print("=== Organizasyon: %s ===" % o["name"])
                  kanallar = buffer('query($i: ChannelsInput!){ channels(input: $i){ id name service } }',
                                    {"i": {"organizationId": o["id"]}})["channels"]
                  if not kanallar:
                      print("  Bagli kanal yok. Buffer'da Instagram hesabini bagla.")
                  for k in kanallar:
                      print("  servis: %-12s ad: %-24s BUFFER_CHANNEL_ID = %s" % (k["service"], k["name"], k["id"]))
              print("\nKimligi kuyruk.json satirinda 'kanal' alanina ya da Secrets'a BUFFER_CHANNEL_ID olarak yaz.")

          # 2) Günün gönderisini kuyruktan bul
          simdi = datetime.now(TR)
          gun = (env("TARIH") or "").strip() or simdi.strftime("%Y-%m-%d")
          if not KUYRUK.exists():
              print("sosyal/kuyruk.json yok, paylasilacak bir sey yok."); sys.exit(0)
          kuyruk = json.loads(KUYRUK.read_text(encoding="utf-8"))
          bugunkuler = [g for g in kuyruk if g.get("tarih") == gun and g.get("yayinla", True)]
          if not bugunkuler:
              print("%s icin kuyrukta gonderi yok." % gun); sys.exit(0)

          deneme = (env("DENEME") or "").lower() == "true"
          if deneme or not (env("BUFFER_CHANNEL_ID") or all(g.get("kanal") for g in bugunkuler)):
              kanallari_listele()
          if not (env("BUFFER_CHANNEL_ID") or all(g.get("kanal") for g in bugunkuler)):
              sys.exit("Kanal kimligi yok; yukaridaki listeden birini kullan.")

          def yukle(dosya):
              url = env("SUPABASE_URL").rstrip("/")
              p = pathlib.Path(dosya)
              ad = "%s/%s" % (gun, p.name)
              tur = mimetypes.guess_type(p.name)[0] or "application/octet-stream"
              r = urllib.request.Request("%s/storage/v1/object/%s/%s" % (url, KOVA, ad),
                  data=p.read_bytes(), method="POST", headers={
                      "Authorization": "Bearer " + env("SUPABASE_SERVICE_KEY"),
                      "Content-Type": tur, "x-upsert": "true"})
              try:
                  with urllib.request.urlopen(r, timeout=180) as c:
                      c.read()
              except urllib.error.HTTPError as h:
                  sys.exit("Supabase HTTP %s: %s" % (h.code, h.read().decode()[:500]))
              return "%s/storage/v1/object/public/%s/%s" % (url, KOVA, ad)

          for g in bugunkuler:
              saat = g.get("saat", "20:00")
              zaman = datetime.strptime(gun + " " + saat, "%Y-%m-%d %H:%M").replace(tzinfo=TR)
              if zaman < simdi + timedelta(minutes=10):
                  zaman = simdi + timedelta(minutes=15)
              due = zaman.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z")
              medya = g.get("medya")
              if medya and not pathlib.Path(medya).exists():
                  sys.exit("Medya dosyasi bulunamadi: " + medya)

              print("-" * 50)
              print("Gun   :", gun, "| Saat:", zaman.strftime("%H:%M"), "(TR)")
              print("Kanal :", g.get("kanal") or env("BUFFER_CHANNEL_ID"))
              print("Medya :", medya or "(yok)")
              if g.get("metadata"):
                  print("Ayar  :", json.dumps(g["metadata"], ensure_ascii=False))
              print("Metin :\n" + g["metin"])
              if deneme:
                  print(">> DENEME MODU: Buffer'a gonderilmedi.")
                  continue

              girdi = {"text": g["metin"], "channelId": g.get("kanal") or env("BUFFER_CHANNEL_ID"),
                       "schedulingType": "automatic", "mode": "customScheduled", "dueAt": due}
              if g.get("metadata"):          # platforma özel ayar (youtube: baslik, gizlilik...)
                  girdi["metadata"] = g["metadata"]
              if medya:
                  link = yukle(medya)
                  print("Yuklendi:", link)
                  video = medya.lower().endswith((".mp4", ".mov"))
                  girdi["assets"] = [{"video" if video else "image": {"url": link}}]
              s = """mutation($i: CreatePostInput!){ createPost(input: $i){
                       ... on PostActionSuccess { post { id dueAt } }
                       ... on MutationError { message } } }"""
              sonuc = buffer(s, {"i": girdi})["createPost"]
              if "message" in sonuc:
                  sys.exit("Gonderi olusturulamadi: " + sonuc["message"])
              print(">> Buffer'a planlandi:", sonuc["post"]["id"], "->", sonuc["post"]["dueAt"])
