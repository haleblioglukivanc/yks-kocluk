name: Sosyal - günlük video üretimi

# Her sabah 06:30 (Türkiye) YARININ videosunu takvimden üretir, yazım denetiminden
# geçirir ve koça Telegram'dan onaya gönderir. Onaylanmayan video paylaşılmaz;
# onaylananları 'Sosyal - onaylı paylaşım' iş akışı Buffer'a planlar.
# Elle: Actions -> bu iş akışı -> Run workflow (tarih boş = yarın).
# 'onaysiz' yalnız koçun zaten onayladığı bir düzeltmeyi yeniden paylaşmak içindir.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      tarih:
        description: 'Hangi günün videosu? (boş = yarın, örn. 2026-09-21)'
        required: false
        default: ''
      deneme:
        description: 'Deneme modu (videoyu üretir, Buffer a göndermez)'
        type: boolean
        default: true
      kanal:
        description: 'Kanallar (yt,ig,tt; boş = hepsi)'
        required: false
        default: ''
      yeniden:
        description: 'Düzeltilmiş gönderiyi yeniden paylaş (o gün gönderi var kontrolünü atla)'
        type: boolean
        default: false
      onaysiz:
        description: 'Onaya göndermeden doğrudan Buffer a planla (yalnız onaylı düzeltmeler için)'
        type: boolean
        default: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sosyal/video/package-lock.json

      - name: Remotion kur
        working-directory: sosyal/video
        run: npm ci --no-audit --no-fund

      - name: Yazım denetimi
        run: |
          sudo apt-get install -y -qq hunspell hunspell-tr >/dev/null
          python3 sosyal/denetim.py --tarih "${TARIH:-$(TZ=Europe/Istanbul date -d tomorrow +%F)}"
        env:
          TARIH: ${{ inputs.tarih }}

      - name: Videoyu üret, onaya gönder
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARIH: ${{ inputs.tarih }}
          DENEME: ${{ inputs.deneme }}
          KANAL: ${{ inputs.kanal }}
          YENIDEN: ${{ inputs.yeniden }}
          ONAYSIZ: ${{ inputs.onaysiz }}
        run: |
          ek=""
          [ -n "$TARIH" ] && ek="--tarih $TARIH"
          [ "$DENEME" = "true" ] && ek="$ek --deneme"
          [ -n "$KANAL" ] && ek="$ek --kanal $KANAL"
          [ "$YENIDEN" = "true" ] && ek="$ek --yeniden"
          if [ "$ONAYSIZ" = "true" ]; then
            python3 sosyal/gunluk.py $ek --render --gonder
          else
            python3 sosyal/gunluk.py $ek --render --onaya
          fi

      - name: Videoyu indirilebilir bırak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gunluk-video
          path: sosyal/medya/gunluk/
          if-no-files-found: ignore
          retention-days: 14
