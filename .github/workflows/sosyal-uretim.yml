name: Sosyal - günlük video üretimi

# Her sabah 06:30 (Türkiye) YARININ videosunu takvimden üretir ve üç kanala
# (YouTube, Instagram, TikTok) Buffer'da planlar. Bir gün önceden planlandığı
# için Buffer'da kontrol etmeye bir gün vakit kalır.
# Elle: Actions -> bu iş akışı -> Run workflow (tarih boş = yarın).
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      tarih:
        description: 'Hangi günün videosu? (boş = yarın, örn. 2026-09-21)'
        required: false
        default: ''
      deneme:
        description: 'Deneme modu (videoyu üretir, Buffer a göndermez)'
        type: boolean
        default: true
      kanal:
        description: 'Kanallar (yt,ig,tt; boş = hepsi)'
        required: false
        default: ''
      yeniden:
        description: 'Düzeltilmiş gönderiyi yeniden paylaş (o gün gönderi var kontrolünü atla)'
        type: boolean
        default: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sosyal/video/package-lock.json

      - name: Remotion kur
        working-directory: sosyal/video
        run: npm ci --no-audit --no-fund

      - name: Videoyu üret ve planla
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARIH: ${{ inputs.tarih }}
          DENEME: ${{ inputs.deneme }}
          KANAL: ${{ inputs.kanal }}
          YENIDEN: ${{ inputs.yeniden }}
        run: |
          ek=""
          [ -n "$TARIH" ] && ek="--tarih $TARIH"
          [ "$DENEME" = "true" ] && ek="$ek --deneme"
          [ -n "$KANAL" ] && ek="$ek --kanal $KANAL"
          [ "$YENIDEN" = "true" ] && ek="$ek --yeniden"
          python3 sosyal/gunluk.py $ek --render --gonder

      - name: Videoyu indirilebilir bırak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gunluk-video
          path: sosyal/medya/gunluk/
          if-no-files-found: ignore
          retention-days: 14
